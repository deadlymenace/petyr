<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Petyr bird mascot">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D08A"/>
      <stop offset="1" stop-color="#E0A93F"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEFD2"/>
      <stop offset="1" stop-color="#F4D89A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#E6B860" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E6B860" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="110" cy="110" r="100" fill="url(#halo)"/>

  <!-- shadow -->
  <ellipse class="shadow" cx="110" cy="196" rx="46" ry="9" fill="#000" opacity=".28"/>

  <g class="bird">
    <!-- tail -->
    <path d="M150 120 q40 6 52 26 q-26 4 -44 -6 z" fill="#C98B2E"/>
    <!-- feet -->
    <g stroke="#B8801F" stroke-width="5" stroke-linecap="round">
      <path d="M96 176 v14"/><path d="M124 176 v14"/>
    </g>
    <!-- body -->
    <ellipse cx="110" cy="124" rx="62" ry="58" fill="url(#body)"/>
    <!-- belly -->
    <ellipse cx="104" cy="134" rx="40" ry="40" fill="url(#belly)"/>

    <!-- far wing -->
    <path class="wing-back" d="M160 110 q34 14 30 44 q-26 -4 -38 -26 z" fill="#D69B33"/>

    <!-- head tuft feathers -->
    <g class="tuft" fill="#E6B860">
      <path d="M96 64 q-6 -22 6 -34 q8 14 4 30 z"/>
      <path d="M112 60 q2 -24 16 -30 q0 16 -8 30 z"/>
    </g>

    <!-- eyes -->
    <g class="eyes">
      <circle cx="92" cy="108" r="15" fill="#fff"/>
      <circle cx="128" cy="108" r="15" fill="#fff"/>
      <circle class="pupil" cx="95" cy="110" r="7" fill="#241803"/>
      <circle class="pupil" cx="131" cy="110" r="7" fill="#241803"/>
      <circle cx="98" cy="107" r="2.4" fill="#fff"/>
      <circle cx="134" cy="107" r="2.4" fill="#fff"/>
      <!-- eyelids for blink -->
      <rect class="lid" x="75" y="92" width="34" height="0" rx="8" fill="url(#body)"/>
      <rect class="lid" x="111" y="92" width="34" height="0" rx="8" fill="url(#body)"/>
    </g>

    <!-- beak -->
    <path d="M104 122 l16 0 l-8 12 z" fill="#E8862B"/>
    <!-- cheek blush -->
    <ellipse cx="74" cy="128" rx="8" ry="5" fill="#F0A65A" opacity=".55"/>
    <ellipse cx="146" cy="128" rx="8" ry="5" fill="#F0A65A" opacity=".55"/>

    <!-- near wing (flaps) -->
    <g class="wing">
      <path d="M58 116 q-34 8 -40 36 q28 4 44 -14 q6 -12 -4 -22 z" fill="#E0A93F"/>
      <path d="M58 116 q-26 8 -32 28" fill="none" stroke="#C98B2E" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
